version: '3.8'

services:
  app:
    build: .
    container_name: student_management_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    restart: always
